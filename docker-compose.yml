version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gradly_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gradly
      MYSQL_USER: gradly_user
      MYSQL_PASSWORD: gradly_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./public/database/script.sql:/docker-entrypoint-initdb.d/script.sql
    networks:
      - gradly_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gradly_web
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_USER=gradly_user
      - DB_PASSWORD=gradly_pass
      - DB_NAME=gradly
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gradly_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gradly_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: gradly_user
      PMA_PASSWORD: gradly_pass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gradly_network

volumes:
  mysql_data:

networks:
  gradly_network:
    driver: bridge